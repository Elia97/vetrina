name: CI

on:
  # Niente paths-ignore su pull_request: `ci` è un check obbligatorio nel ruleset, e un job
  # saltato non riporta niente — la PR resta appesa su "Expected — Waiting for status".
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**/*.md'
      - '.github/**/*.md'
      - '.claude/**/*.md'

# Dichiarati invece che ereditati: girando sulle PR, è questo il workflow su cui entrerebbe
# un'action di terze parti.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Niente `name:` qui: lo prenderebbe il check run, e il ruleset pretende il contesto `ci`,
  # che è l'id del job.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run ci

      - run: pnpm run build

      # Legge dist/client, quindi deve seguire la build.
      - run: pnpm run perf:bundle

  # Altrimenti `fallow review` gira solo a mano: una PR aperta a mano o da Dependabot non lo
  # vedrebbe mai. I confini stanno invece dentro `pnpm run ci`, che gira nel job qui sopra.
  fallow:
    name: fallow (review informativa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # il riepilogo di review fa il diff contro il merge-base

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: fallow review (informativa, esce sempre 0)
        run: pnpm exec fallow review

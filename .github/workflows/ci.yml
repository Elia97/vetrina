name: CI

on:
  # Niente paths-ignore su pull_request: `ci` è un check obbligatorio nel ruleset, e un job
  # saltato non riporta niente — la PR resta appesa su "Expected — Waiting for status".
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**/*.md'
      - '.github/**/*.md'
      - '.claude/**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Niente `name:` qui: lo prenderebbe il check run, e il ruleset pretende il contesto `ci`,
  # che è l'id del job.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: Elia97/officina/actions/ci@v0.5.0
        with:
          e2e: 'true'

  fallow:
    name: fallow (review informativa)
    runs-on: ubuntu-latest
    steps:
      - uses: Elia97/officina/actions/review@v0.5.0

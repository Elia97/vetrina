version: 2

# [HARD] `doctor` pretende che il riferimento delle action sia la versione del pacchetto installato.
multi-ecosystem-groups:
  officina:
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
    # Solo qui: su una voce con `multi-ecosystem-group` Dependabot rifiuta l'intero file.
    commit-message:
      prefix: 'chore(deps)'

updates:
  # `patterns` limita l'aggiornamento ai soli pacchetti elencati: senza una seconda voce,
  # il resto dell'ecosistema smette di aggiornarsi senza nessun errore (dependabot-core#12437).
  - package-ecosystem: 'npm'
    directory: '/'
    # Il preset di Biome di officina nomina regole che una minor può rinominare:
    # con la 2.6 `useSortedClasses` è diventata `useTailwindSortedClasses`.
    patterns:
      - '@elia97/officina'
      - '@biomejs/biome'
    multi-ecosystem-group: 'officina'
    schedule:
      interval: 'weekly'
    # Senza la chiave Dependabot applica comunque 3 giorni di cooldown, e 0 a un pacchetto in `exclude`:
    # va tenuto uguale all'`exclude` di `Elia97/officina` nella voce github-actions del gruppo.
    cooldown:
      default-days: 7
      exclude:
        - '@elia97/officina'
    ignore:
      - dependency-name: '@biomejs/biome'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
    # [HARD] `chore` è nascosto in `changelog-sections` e il job di deploy gira solo su un tag:
    # un bump mergiato qui raggiunge la produzione col primo commit rilasciabile, mai da solo.
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      - dependency-name: '@elia97/officina'
      - dependency-name: '@biomejs/biome'
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # `astro check` usa l'API programmatica di TypeScript, che il compilatore nativo 7.x
      # non porta ancora. Stato a monte: https://github.com/withastro/roadmap/discussions/1321
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      # Due PR mergiate a secondi di distanza fondono i pnpm-lock.yaml con una chiave duplicata.
      npm:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    patterns:
      - 'Elia97/officina'
    multi-ecosystem-group: 'officina'
    schedule:
      interval: 'weekly'
    cooldown:
      exclude:
        - 'Elia97/officina'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'github-actions'
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      - dependency-name: 'Elia97/officina'
    groups:
      github-actions:
        patterns:
          - '*'
